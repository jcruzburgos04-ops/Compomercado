# Canastas propias (BORRADOR). Cada canasta se analiza igual que un sector:
# comportamiento en cada caída, beta bajista, captura, correlación en estrés,
# correlación interna y diversificación efectiva.
#
# ponderacion: igual | capitalizacion | inversa_volatilidad | manual
# rebalanceo:  diario | mensual | trimestral
# Con ponderacion "manual", cada componente lleva su peso: {ticker: X, peso: 0.25}

mega_caps:
  descripcion: "Mega caps de EE. UU."
