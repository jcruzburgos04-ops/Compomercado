# Series macro y de estrés (FRED). Detalle y uso en docs/catalogo_variables.md.
fred:
  - BAA10Y          # spread Baa - Tesoro 10a
  - BAMLH0A0HYM2    # OAS high yield (historial recortado en FRED: verificar)
  - BAMLC0A0CM      # OAS grado de inversión (idem)
  - T10Y2Y
  - T10Y3M
  - DGS10
  - DFII10
  - T10YIE
  - STLFSI4         # St. Louis Fed Financial Stress Index (semanal)
  - NFCI            # Chicago Fed (semanal)
  - ANFCI
  - WALCL           # balance de la Fed
  - WTREGEN         # cuenta del Tesoro (TGA)
  - RRPONTSYD       # repos reversos
  - ICSA            # pedidos iniciales de desempleo
  - SAHMREALTIME
  - DCOILWTICO
  - DEXJPUS
  - USREC           # recesiones NBER (solo etiqueta, no predictor)

