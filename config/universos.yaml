# Series macro y de estrés (FRED). lag_dias = días corridos entre la fecha del dato y su
# publicación (conservador). Se aplica siempre antes de usar la serie como indicador.
fred:
  BAA10Y: {lag_dias: 1, nombre: "Spread Baa - Tesoro 10a"}
  BAMLH0A0HYM2: {lag_dias: 1, nombre: "OAS high yield (historial recortado en FRED)"}
  BAMLC0A0CM: {lag_dias: 1, nombre: "OAS grado de inversión (historial recortado en FRED)"}
  T10Y2Y: {lag_dias: 1, nombre: "Curva 10a - 2a"}
  T10Y3M: {lag_dias: 1, nombre: "Curva 10a - 3m"}
  DGS10: {lag_dias: 1, nombre: "Tasa del Tesoro 10a"}
  DGS2: {lag_dias: 1, nombre: "Tasa del Tesoro 2a"}
  DFII10: {lag_dias: 1, nombre: "Tasa real 10a (TIPS)"}
  T10YIE: {lag_dias: 1, nombre: "Breakeven de inflación 10a"}
  STLFSI4: {lag_dias: 7, nombre: "Índice de estrés financiero St. Louis Fed (semanal)"}
  NFCI: {lag_dias: 6, nombre: "Condiciones financieras Chicago Fed (semanal)"}
  ANFCI: {lag_dias: 6, nombre: "Condiciones financieras ajustadas Chicago Fed (semanal)"}
  WALCL: {lag_dias: 2, nombre: "Balance de la Fed"}
  WTREGEN: {lag_dias: 2, nombre: "Cuenta del Tesoro (TGA)"}
  RRPONTSYD: {lag_dias: 1, nombre: "Repos reversos"}
  ICSA: {lag_dias: 6, nombre: "Pedidos iniciales de desempleo"}
  SAHMREALTIME: {lag_dias: 40, nombre: "Regla de Sahm (tiempo real)"}
  DCOILWTICO: {lag_dias: 7, nombre: "Petróleo WTI spot"}
  DEXJPUS: {lag_dias: 7, nombre: "Yenes por dólar"}
  USREC: {lag_dias: 365, nombre: "Recesiones NBER (solo etiqueta)"}

# Series CBOE (fuente primaria de la familia VIX; Yahoo queda como respaldo).
cboe: [VIX, VIX9D, VIX3M, VIX6M, VVIX, SKEW, VXN, RVX, OVX, GVZ]

