name: Diario

# Descarga datos, corre el análisis, guarda el registro forward y publica el dashboard en GitHub Pages.
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, después del cierre de EE. UU. (todo el año)
  workflow_dispatch:
  push:
    branches: [claude/awesome-wright-d8v4po]
    paths: ["src/**", "config/**", "pyproject.toml", ".github/workflows/diario.yml"]

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Preparar la rama del registro forward
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin registro >/dev/null; then
            git fetch --depth=1 origin registro:registro
            git worktree add registro registro
          else
            git worktree add --detach registro
            cd registro
            git checkout --orphan registro
            git rm -rf --quiet . || true
          fi

      - name: Descargar datos
        run: compomercado datos

      - name: Analizar y construir el dashboard
        run: compomercado analizar

      - name: Guardar el registro forward
        run: |
          cd registro
          git add -A
          if git diff --cached --quiet; then
            echo "Sin filas nuevas en el registro"
          else
            git commit -m "Registro $(date -u +%Y-%m-%d)"
            git push origin registro
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
